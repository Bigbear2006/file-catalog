[project]
name = "file-catalog"
version = "1.0.0"
description = "Сайт для скачивания и анализа текстовых файлов"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "environs>=11.0.0",
    "dishka>=1.10.1",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "ruff>=0.15.22",
]
test = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-order>=1.5.0",
]

[tool.ruff]
line-length = 79
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF022"  # sort __all__
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/**.py" = ["E501"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
disable_error_code = ["union-attr", "var-annotated"]

[tool.pytest.ini_options]
python_classes = "TestCase"
